services:
  - type: web
    name: whatsapp-sender-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    buildpacks:
      - https://github.com/render-com/puppeteer-buildpack
      - https://github.com/render-com/render-buildpack-nodejs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false # O 'sync: false' significa que você preencherá o valor lá no painel, por segurança